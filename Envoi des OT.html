/* ===== Outils communs ===== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=(()=>{const d=new Date();d.setHours(12,0,0,0);return d})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=n=>n.split(/[ -]/).filter(Boolean).map(p=>p[0]).slice(0,2).join("");
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const mins=t=>{if(!t)return NaN;const[h,m]=t.split(":").map(Number);return h*60+m};
const hm=x=>isNaN(x)?"--:--":`${pad(Math.floor(x/60)%24)}:${pad(x%60)}`;
const fdur=d=>!d||d<=0?"":`${Math.floor(d/60)} h ${pad(d%60)}`;
const fnum=n=>String(Math.round(n*100)/100).replace(".",",");
const fq=(q,u)=>`${fnum(q)} ${UNITS[u][q>1?1:0]}`;
const fdate=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fds=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const nowLabel=()=>{const d=new Date();return `le ${d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})} à ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const HOURS=[...Array(24).keys()].map(pad);
const QUARTS=["00","15","30","45"];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function weekOf(date){const d=new Date(date+"T12:00"),day=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-day);
  const th=new Date(mon);th.setDate(mon.getDate()+3);const y=new Date(th.getFullYear(),0,4);
  const num=1+Math.round(((th-y)/864e5-3+((y.getDay()+6)%7))/7);const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  return{key:iso(mon),num,label:`Semaine ${num} · du ${mon.getDate()} au ${fri.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}`}}

/* Horaires : la 1re personne de l'équipe donne la référence ; « Oui » = même heure pour tous, « Non » = saisie individuelle */
const leadOf=sg=>[...sg.team][0];
const val=(sg,k,id)=>{const g=sg[k];if(g.same||id===leadOf(sg))return g.common;return g.v[id]??g.common};
const has=(t,id)=>t instanceof Set?t.has(id):t.includes(id);
const cnt=t=>t instanceof Set?t.size:t.length;
/* Une fin plus tôt que le début = poste de nuit qui finit le lendemain */
const span=(s,e)=>{const a=mins(s),b=mins(e);if(isNaN(a)||isNaN(b))return null;return[a,b<=a?b+1440:b]};
const pspan=(sg,id)=>span(val(sg,"s",id),val(sg,"e",id));
const pdur=(sg,id)=>{const x=pspan(sg,id);return x?x[1]-x[0]:0};
const isNight=(sg,id)=>{const x=pspan(sg,id);return !!x&&x[1]>=1440};
const segRange=sg=>{const sp=[...sg.team].map(id=>pspan(sg,id)).filter(Boolean);if(!sp.length)return"--:-- – --:--";
  const a=Math.min(...sp.map(x=>x[0])),b=Math.max(...sp.map(x=>x[1]));return `${hm(a)} – ${hm(b)}${b>=1440?" (+1 j)":""}`};
const dayTeamOf=r=>{const o=[];r.segs.forEach(sg=>[...sg.team].forEach(id=>{if(!o.includes(id))o.push(id)}));return o};
/* Contrôles : heures saisies, 14 h maximum, pas de chevauchement avec un autre chantier du même jour */
function checkSeg(sg,others,P){const errs=[],bad=new Map();
  const add=(id,k,msg,other)=>{errs.push({id,k,msg,other});if(!bad.has(id))bad.set(id,k)};
  [...sg.team].forEach(id=>{const n=P[id].nom,sv=val(sg,"s",id),ev=val(sg,"e",id);
    if(!sv)return add(id,"s",`Heure de début à saisir pour ${n}.`);
    if(!ev)return add(id,"e",`Heure de fin à saisir pour ${n}.`);
    const[s,e]=span(sv,ev);
    if(e-s>14*60)return add(id,"e",`${n} : ${fdur(e-s)} de travail, plus de 14 h. Vérifiez l'heure de fin.`);
    others.forEach(o=>{if(o.sg===sg||!has(o.sg.team,id))return;const x=pspan(o.sg,id);
      if(x&&s<x[1]&&x[0]<e)add(id,s>=x[0]?"s":"e",`${n} est déjà sur ${o.label} de ${hm(x[0])} à ${hm(x[1])}.`,o.idx)})});
  return{errs,bad}}
/* Sélecteur d'heure au quart d'heure */
function tsel(key,v,label){const[h,m]=v?v.split(":"):["","00"];
  return `<span class="tsel" role="group" aria-label="${esc(label)}"><select data-tk="${key}" aria-label="Heures"><option value="">--</option>${HOURS.map(x=>`<option${x===h?" selected":""}>${x}</option>`).join("")}</select><b>:</b><select data-tk="${key}" aria-label="Minutes">${QUARTS.map(x=>`<option${x===m?" selected":""}>${x}</option>`).join("")}</select></span>`}

/* Historique d'exemple : 4 semaines de feuilles pour les 3 équipes */
function genReports(){const R=[],rnd=rng(4217),MB=Object.fromEntries(MATS.map(m=>[m.id,m]));
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const minus=(t,d)=>hm(mins(t)-d);
  const qty=u=>u==="m"?10+Math.floor(rnd()*70):u==="kit"?1+Math.floor(rnd()*4):u==="u"?1+Math.floor(rnd()*6):u==="kg"?5+Math.floor(rnd()*30):u==="L"?10+Math.floor(rnd()*40):5+Math.floor(rnd()*20);
  const mats=k=>{const pool=[...CH_MAT[k]],n=2+Math.floor(rnd()*2),out=[];for(let i=0;i<n&&pool.length;i++){const m=MB[pool.splice(Math.floor(rnd()*pool.length),1)[0]];out.push({id:m.id,qty:qty(m.unite)})}return out};
  const seg=(k,team,s,e,diff)=>{const eg=diff?{common:e,same:false,v:Object.fromEntries(team.map(id=>[id,id===diff?minus(e,60):e]))}:{common:e,same:true,v:{}};
    return{chantier:k,team:[...team],s:{common:s,same:true,v:{}},e:eg,mat:mats(k)}};
  for(let back=28;back>=1;back--){const d=new Date(TODAY);d.setDate(d.getDate()-back);const wd=d.getDay();if(wd===0||wd===6)continue;const date=iso(d);
    TEAMS.forEach(t=>{const team=[...t.membres];if(rnd()<.3)team.push(t.extra);
      const start=pick(["07:30","08:00","08:00"]),end=pick(["16:00","16:30","17:00","17:30"]),k1=pick(t.chantiers),segs=[];
      const diff=rnd()<.25?team[team.length-1]:null;
      if(rnd()<.4){const mid=pick(["11:30","12:00","13:00"]),k2=t.chantiers.find(k=>k!==k1);segs.push(seg(k1,team,start,mid,null),seg(k2,team,mid,end,diff))}
      else segs.push(seg(k1,team,start,end,diff));
      const veh=rnd()<.7?[...t.veh]:[t.veh[0]],drv={};
      veh.forEach((v,i)=>{const who=i===0?team[1]:team[0];drv[v]={matin:who,journee:who,soir:who}});
      const vcom={};if(rnd()<.15)vcom[veh[0]]=pick(VCOMS);
      R.push({id:`${t.id}-${date}`,team:t.id,author:t.author,date,start,segs,veh,drv,vcom,comment:rnd()<.3?pick(COMS):""})})}
  return R}

function recapHTML(r){const team=dayTeamOf(r);
  return `<div class="recap">
  ${r.segs.map((sg,i)=>{const k=K[sg.chantier];return `<section><h3>Chantier ${i+1} · ${segRange(sg)}</h3><b>${esc(k.code)} · ${esc(k.nom)}</b><span class="hint">${esc(k.lieu)} · Responsable${k.resp.length>1?"s":""} : ${esc(respTxt(k))}</span>
    ${[...sg.team].map(id=>{const s=val(sg,"s",id),e=val(sg,"e",id),diff=s!==sg.s.common||e!==sg.e.common;
      return `<div class="kv"><span>${esc(P[id].nom)}</span><span>${diff?`<span class="tag warn">${s} – ${e}</span>`:`${s} – ${e}`}${isNight(sg,id)?' <span class="tag">+1 j</span>':""}</span></div>`}).join("")}
    ${sg.mat.length?`<span class="sub-h">Matériaux</span>${sg.mat.map(x=>`<div class="kv"><span>${esc(M[x.id].nom)}</span><span>${x.qty>0?fq(x.qty,M[x.id].unite):"—"}</span></div>`).join("")}`:""}</section>`}).join("")}
  <section><h3>Véhicules</h3>${r.veh.length?r.veh.map(vid=>{const d=r.drv[vid]||{},c=(r.vcom||{})[vid];
    return `<div><b>${esc(V[vid].nom)}</b> <span class="tag">${V[vid].plaque}</span>${SLOTS.map(([k,l])=>`<div class="kv"><span>${l}</span><span>${d[k]?esc(P[d[k]].nom):"—"}</span></div>`).join("")}${c?`<p class="note info comment">${esc(c)}</p>`:""}</div>`}).join(""):'<span class="hint">Aucun véhicule déclaré.</span>'}</section>
  <section><h3>Total par personne</h3>${team.map(id=>`<div class="kv"><span>${esc(P[id].nom)}</span><span>${fdur(r.segs.reduce((a,sg)=>a+(has(sg.team,id)?pdur(sg,id):0),0))}</span></div>`).join("")}</section>
  <section><h3>Commentaire</h3>${r.comment&&r.comment.trim()?`<div class="comment">${esc(r.comment)}</div>`:'<span class="hint">Aucun commentaire.</span>'}</section>
  </div>`}

/* ---------- Écrans de saisie ---------- */
const VIEWS={
  debut(){const b=S.base,isLast=b===HIST[0];
    const modes=MODES.map(m=>{const off=m.id!=="vierge"&&!b,t=m.id==="veille"&&b&&!isLast?`Rapport du ${fdate(b.date)}`:m.titre;
      return `<button class="opt" type="button" data-mode="${m.id}" aria-pressed="${S.mode===m.id}"${off?" disabled":""}><span class="meta"><b>${esc(t)}</b><span>${m.desc}</span></span><span class="check radio">${S.mode===m.id?"●":""}</span></button>`}).join("");
    return `<div class="panel"><div><h2>Comment démarrer la feuille ?</h2><p class="hint">Vous ne corrigerez ensuite que ce qui change.</p></div>
    <div class="list">${modes}</div>
    ${S.mode!=="vierge"&&b?`<div class="rows"><div class="row"><span class="meta"><b>Base : ${esc(fdate(b.date))}</b><span>${S.mode==="veille"?`${b.segs.map(s=>K[s.chantier].code).join(" puis ")} · ${b.veh.length} véhicule(s) · `:""}${dayTeamOf(b).map(id=>P[id].nom).join(", ")}</span></span></div></div>`:""}
    <div class="field"><label for="date">Date</label><input type="date" id="date" value="${S.date}"></div>
    ${S.mode!=="veille"?`<div class="field"><span class="lbl">Heure de début</span>${tsel("day",S.start,"Heure de début")}</div>`:'<p class="hint">Les horaires de la base sont repris et restent modifiables chantier par chantier. Les matériaux sont repris sans quantité.</p>'}</div>`},
  chantier(){const sg=seg(),q=norm(S.q.k||"");
    const list=CHANTIERS.filter(k=>norm(k.code+" "+k.nom+" "+k.lieu).includes(q));
    return `<div class="panel"><div>${segHead()}<h2>Choisir le chantier</h2></div>
    <input class="search" type="search" data-q="k" id="qk" placeholder="Numéro, nom ou commune" value="${esc(S.q.k||"")}">
    <div class="list">${list.map(k=>{const on=sg.chantier===k.id;
      return `<button class="opt" type="button" data-k="${k.id}" aria-pressed="${on}"><span class="meta"><b>${esc(k.nom)}</b><span>${esc(k.lieu)} · ${esc(respTxt(k))}</span></span><span class="tag">${k.code}</span><span class="check radio">${on?"●":""}</span></button>`}).join("")||'<p class="hint">Aucun chantier trouvé.</p>'}</div></div>`},
  equipe(){const sg=seg(),q=norm(S.q.n||""),bt=baseTeam();
    const agence=PEOPLE.filter(p=>p.agence===AGENCE&&!bt.includes(p.id));
    const nat=PEOPLE.filter(p=>p.agence!==AGENCE&&!bt.includes(p.id)&&(sg.team.has(p.id)||(q.length>=2&&norm(p.nom+p.role+p.agence).includes(q))));
    const allIn=bt.every(id=>sg.team.has(id));
    return `<div class="panel"><div>${segHead()}<h2>Choisir l'équipe</h2><p class="hint">${sg.team.size} personne(s) sélectionnée(s).</p></div>
    <div class="sec"><div class="sec-h"><span>Équipe d'hier</span>${allIn?"":`<button class="link" type="button" data-allveille="1">Tout reprendre</button>`}</div>
      <div class="list">${bt.map(id=>personBtn(P[id],sg)).join("")}</div></div>
    <div class="sec"><div class="sec-h"><span>Agence de ${AGENCE}</span></div><div class="list">${agence.map(p=>personBtn(p,sg)).join("")}</div></div>
    <div class="sec"><div class="sec-h"><span>Recherche nationale</span></div>
      <input class="search" type="search" data-q="n" id="qn" placeholder="Nom, poste ou agence (2 lettres min.)" value="${esc(S.q.n||"")}">
      <div class="list">${nat.map(p=>personBtn(p,sg)).join("")||(q.length>=2?'<p class="hint">Aucun résultat.</p>':"")}</div></div></div>`},
  heures(){const sg=seg(),{errs,bad}=check(sg);
    return `<div class="panel"><div>${segHead()}<h2>Horaires sur ce chantier</h2><p class="hint">${esc(K[sg.chantier].nom)} · au quart d'heure · une fin avant le début = fin le lendemain</p></div>
    ${S.ret!=null?`<p class="note">Correction en cours. Une fois l'horaire corrigé, revenez au chantier ${S.ret+1}.</p>`:""}
    ${timeBlock(sg,"s")}${timeBlock(sg,"e")}
    <div class="sec"><div class="sec-h"><span>Résultat par personne</span></div><div class="rows">
    ${[...sg.team].map(id=>{const s=val(sg,"s",id),e=val(sg,"e",id),k=bad.get(id);
      const inner=`<span class="meta"><b>${esc(P[id].nom)}</b></span><span class="time">${s||"--:--"} – ${e||"--:--"}${isNight(sg,id)?" +1 j":""}</span><span class="dur">${fdur(pdur(sg,id))}</span>`;
      return k?`<button type="button" class="row bad" data-fix="${k}|${id}" aria-label="Corriger l'horaire de ${esc(P[id].nom)}">${inner}</button>`:`<div class="row">${inner}</div>`}).join("")}</div></div>
    ${errs.length?`<div class="note"><ul>${errs.slice(0,5).map(x=>`<li><button type="button" data-fix="${x.k}|${x.id}">${esc(x.msg)}</button>${x.other!=null&&S.ret==null?`<br><button type="button" class="link" data-goseg="${x.other}">Corriger sur le chantier ${x.other+1}</button>`:""}</li>`).join("")}</ul></div>`:""}</div>`},
  materiaux(){const sg=seg();
    return `<div class="panel"><div>${segHead()}<h2>Matériaux utilisés</h2><p class="hint">${esc(K[sg.chantier].nom)}. Les matériaux prévus sur ce chantier sont proposés en premier.</p></div>${matSection(sg,S.cur)}</div>`},
  suite(){const sg=seg(),nxt=S.segs[S.cur+1],endRef=hm(Math.max(...[...sg.team].map(id=>pspan(sg,id)?.[1]??0)));
    return `<div class="panel"><div><p class="eyebrow">Chantier ${S.cur+1} terminé</p><h2>Un autre chantier ensuite ?</h2></div>
    <ol class="tl">${S.segs.slice(0,S.cur+1).map(s=>`<li><span class="time">${segRange(s)}</span> <b>${esc(K[s.chantier].code)} · ${esc(K[s.chantier].nom)}</b><br><span>${esc(K[s.chantier].lieu)} · ${s.team.size} pers. · ${s.mat.length} matériau(x)</span></li>`).join("")}</ol>
    <div class="list"><button class="opt" type="button" data-act="more"><span class="meta"><b>Oui, chantier suivant</b><span>${nxt&&nxt.chantier?`${esc(K[nxt.chantier].code)} déjà pré-rempli`:`À partir de ${endRef}, avec les personnes qui finissaient à cette heure`}</span></span><span class="tag">+</span></button>
    <button class="opt" type="button" data-act="stop"><span class="meta"><b>Non, passer aux véhicules</b><span>${nxt?`Le chantier ${S.cur+2} pré-rempli sera retiré`:"Véhicules et conducteurs de la journée"}</span></span><span class="tag">→</span></button></div></div>`},
  vehicules(){const bv=baseVeh(),ag=VEHICULES.filter(v=>!bv.includes(v.id));
    return `<div class="panel"><div><h2>Véhicules utilisés</h2><p class="hint">Pour toute la journée. Plusieurs choix possibles.</p></div>
    ${bv.length?`<div class="sec"><div class="sec-h"><span>Véhicules d'hier</span></div><div class="list">${bv.map(id=>vehBtn(V[id])).join("")}</div></div>`:""}
    <div class="sec"><div class="sec-h"><span>Agence de ${AGENCE}</span></div><div class="list">${ag.map(vehBtn).join("")}</div></div></div>`},
  conducteurs(){const team=dayTeam(),c=drvConflicts();
    const opts=sel=>`<option value="">—</option>`+team.map(id=>`<option value="${id}"${sel===id?" selected":""}>${esc(P[id].nom)}</option>`).join("");
    return `<div class="panel"><div><h2>Qui a conduit ?</h2><p class="hint">Pour chaque véhicule : matin, journée, soir.</p></div>
    ${[...S.veh].map(vid=>{const v=V[vid],d=S.drv[vid]||{},com=S.vcom[vid]||"",open=S.vopen.has(vid)||!!com;
      return `<div class="vcard"><div class="vcard-h"><b>${esc(v.nom)}</b>${com?'<span class="tag acc">commentaire</span>':""}<span class="tag">${v.plaque}</span></div>
      <div class="slots">${SLOTS.map(([k,l])=>`<label>${l}<select data-drv="${vid}|${k}">${opts(d[k])}</select></label>`).join("")}</div>
      ${d.matin&&!(d.journee===d.matin&&d.soir===d.matin)?`<button class="link" type="button" data-copy="${vid}">Même conducteur sur les trois créneaux</button>`:""}
      ${open?`<textarea id="vc-${vid}" data-vcom="${vid}" maxlength="500" placeholder="Situation particulière, panne, plein, dégât…" aria-label="Commentaire sur ${esc(v.nom)}">${esc(com)}</textarea>`:`<button class="link" type="button" data-vopen="${vid}">+ Ajouter un commentaire</button>`}</div>`}).join("")}
    ${c.length?`<p class="note">${esc(c[0])}</p>`:""}</div>`},
  commentaire(){return `<div class="panel"><div><h2>Commentaire de la journée</h2><p class="hint">Incident, météo, remarque client, demande de matériel… Facultatif.</p></div>
    <textarea id="comment" maxlength="2000" style="min-height:170px" placeholder="Saisissez votre commentaire">${esc(S.comment)}</textarea></div>`},
  recap(){return `<div class="panel"><div><h2>Récapitulatif</h2><p class="hint">${esc(fdate(S.date))}. Vérifiez avant d'enregistrer.</p></div>${recapHTML(toRep())}</div>`},
  done(){const w=weekOf(S.date);return `<div class="panel done-box"><div class="ok">Journée enregistrée</div>
    <p class="hint">${S.segs.length} chantier(s), ${dayTeam().length} personne(s), ${S.veh.size} véhicule(s). Elle sera incluse dans le rapport de la ${esc(w.label.toLowerCase())}.</p>
    <button class="btn" type="button" data-gotab="semaine">Voir ma semaine</button></div>`}
};

/* ---------- Mes rapports ---------- */
function rapportsView(){
  if(UI.rep){const r=HIST.find(x=>x.id===UI.rep);return `<div class="panel"><div><p class="eyebrow">Rapport en lecture seule</p><h2>${esc(fdate(r.date))}</h2><p class="hint">${esc(weekOf(r.date).label)} · ${SENT[weekOf(r.date).key]?"rapport hebdo envoyé "+SENT[weekOf(r.date).key]:"rapport hebdo à envoyer"}</p></div>${recapHTML(r)}</div>`}
  const q=norm(UI.rq);
  const match=r=>!q||norm(fdate(r.date)+" "+new Date(r.date+"T12:00").toLocaleDateString("fr-FR")+" "+r.segs.map(s=>K[s.chantier].code+" "+K[s.chantier].nom).join(" ")).includes(q);
  const list=HIST.filter(match),weeks=[];list.forEach(r=>{const w=weekOf(r.date);let g=weeks.find(x=>x.key===w.key);if(!g)weeks.push(g={...w,reps:[]});g.reps.push(r)});
  return `<div class="panel"><div><h2>Mes rapports</h2><p class="hint">${HIST.length} journées enregistrées. Touchez une journée pour la revoir.</p></div>
  <input class="search" type="search" id="rq" placeholder="Date (ex. 12/10), numéro ou nom de chantier" value="${esc(UI.rq)}">
  ${weeks.map(w=>`<div class="sec"><div class="wk-h"><b>${esc(w.label)}</b>${SENT[w.key]?`<span class="pill ok">Envoyé ${esc(SENT[w.key])}</span>`:'<span class="pill todo">À envoyer</span>'}</div>
    <div class="rows">${w.reps.map(r=>`<button type="button" class="row" data-rep="${r.id}"><span class="meta"><b>${esc(fds(r.date))}</b><span>${r.segs.map(s=>K[s.chantier].code).join(" · ")} · ${dayTeamOf(r).length} pers.</span></span><span class="dur">${fdur(r.segs.reduce((a,sg)=>a+(has(sg.team,ME)?pdur(sg,ME):0),0))}</span></button>`).join("")}</div></div>`).join("")||'<p class="hint">Aucun rapport ne correspond.</p>'}</div>`}

/* ---------- Ma semaine (rapport hebdomadaire) ---------- */
function weekData(key){const reps=HIST.filter(r=>weekOf(r.date).key===key).sort((a,b)=>a.date.localeCompare(b.date));
  const people=[];reps.forEach(r=>dayTeamOf(r).forEach(id=>{if(!people.includes(id))people.push(id)}));
  const hours={};people.forEach(id=>hours[id]={});
  reps.forEach(r=>r.segs.forEach(sg=>[...sg.team].forEach(id=>{hours[id][r.date]=(hours[id][r.date]||0)+pdur(sg,id)})));
  const ch={};reps.forEach(r=>r.segs.forEach(sg=>{const c=ch[sg.chantier]=ch[sg.chantier]||{h:0,days:new Set(),mat:{}};c.days.add(r.date);
    [...sg.team].forEach(id=>c.h+=pdur(sg,id));sg.mat.forEach(x=>{if(x.qty>0)c.mat[x.id]=(c.mat[x.id]||0)+x.qty})}));
  const veh={};reps.forEach(r=>r.veh.forEach(v=>{const o=veh[v]=veh[v]||{days:new Set(),drv:new Set()};o.days.add(r.date);Object.values(r.drv[v]||{}).forEach(d=>d&&o.drv.add(d))}));
  const coms=[];reps.forEach(r=>{if(r.comment)coms.push([r.date,"Journée",r.comment]);Object.entries(r.vcom||{}).forEach(([v,t])=>t&&coms.push([r.date,V[v].nom,t]))});
  const resp={};Object.keys(ch).forEach(k=>K[k].resp.forEach(x=>{(resp[x]=resp[x]||[]).includes(k)||resp[x].push(k)}));
  return{reps,people,hours,ch,veh,coms,resp}}
function semaineView(){
  const keys=[...new Set(HIST.map(r=>weekOf(r.date).key))].slice(0,6);if(!UI.wk||!keys.includes(UI.wk))UI.wk=keys[0];
  if(!UI.wk)return `<div class="panel"><h2>Ma semaine</h2><p class="hint">Aucune journée enregistrée.</p></div>`;
  const w=weekOf(UI.wk),d=weekData(UI.wk),sent=SENT[UI.wk];
  const chips=`<div class="chips">${keys.map(k=>`<button class="chip" type="button" data-wk="${k}" aria-pressed="${k===UI.wk}">S${weekOf(k).num}${SENT[k]?"":' <span class="pill todo">à envoyer</span>'}</button>`).join("")}</div>`;
  const recips=`<div class="rows"><div class="row"><span class="av">${esc(ini(P[ME].nom))}</span><span class="meta"><b>${esc(P[ME].nom)} (vous)</b><span>Technicien · rapport complet</span></span></div>
    ${Object.entries(d.resp).map(([r,ks])=>`<div class="row"><span class="av">${esc(ini(RS[r].nom))}</span><span class="meta"><b>${esc(RS[r].nom)}</b><span>${esc(RS[r].role)} · reçoit ${ks.map(k=>K[k].code).join(", ")}</span></span></div>`).join("")}</div>`;
  if(UI.wstep==="preview"){
    return `<div class="panel"><div><p class="eyebrow">${esc(w.label)}</p><h2>Vérifier l'envoi</h2><p class="hint">${1+Object.keys(d.resp).length} emails : le rapport complet pour vous, et pour chaque responsable la partie de ses chantiers.</p></div>
    <div class="mail"><div class="mail-h"><div><span>À :</span> ${esc(P[ME].nom)}</div><div><span>Objet :</span> Rapport hebdomadaire S${w.num} · ${esc(P[ME].nom)}</div></div>
      <div class="mail-b"><p class="hint">Bonjour,</p><p class="hint">Voici le récapitulatif de la ${esc(w.label.toLowerCase())} : ${d.reps.length} journée(s), ${Object.keys(d.ch).length} chantier(s), ${fdur(Object.values(d.ch).reduce((a,c)=>a+c.h,0))} au total pour l'équipe.</p>
      ${Object.entries(d.ch).map(([k,c])=>`<div class="kv"><span>${esc(K[k].code)} · ${esc(K[k].nom)}</span><span>${fdur(c.h)}</span></div>`).join("")}</div></div>
    ${Object.entries(d.resp).map(([r,ks])=>`<div class="mail"><div class="mail-h"><div><span>À :</span> ${esc(RS[r].nom)} · ${esc(RS[r].role)}</div><div><span>Objet :</span> Rapport S${w.num} · ${ks.map(k=>"chantier "+K[k].code).join(", ")}</div></div>
      <div class="mail-b">${ks.map(k=>`<div class="kv"><span>${esc(K[k].code)} · ${d.ch[k].days.size} jour(s)</span><span>${fdur(d.ch[k].h)}</span></div>`).join("")}</div></div>`).join("")}
    <p class="note info">Prototype : aucun email n'est réellement envoyé. Dans la version réelle, l'envoi se fera depuis le serveur.</p></div>`}
  return `<div class="panel"><div><h2>Rapport hebdomadaire</h2><p class="hint">${esc(w.label)} · ${d.reps.length} journée(s) saisie(s)</p></div>
  ${chips}
  ${sent?`<p class="note ok">Rapport envoyé ${esc(sent)}.</p>`:'<p class="note">Rapport pas encore envoyé.</p>'}
  <div class="sec"><div class="sec-h"><span>Heures par personne</span></div><div class="scroll"><table class="grid"><thead><tr><th>Personne</th>${d.reps.map(r=>`<th>${esc(fds(r.date).replace(/\.$/,""))}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>${d.people.map(id=>{const t=Object.values(d.hours[id]).reduce((a,b)=>a+b,0);return `<tr><td>${esc(P[id].nom)}</td>${d.reps.map(r=>`<td>${d.hours[id][r.date]?fdur(d.hours[id][r.date]):"—"}</td>`).join("")}<td class="tot">${fdur(t)}</td></tr>`}).join("")}</tbody></table></div></div>
  <div class="sec"><div class="sec-h"><span>Par chantier</span></div><div class="recap">${Object.entries(d.ch).map(([k,c])=>`<section><h3>${esc(K[k].code)} · ${c.days.size} jour(s) · ${fdur(c.h)}</h3><b>${esc(K[k].nom)}</b>
    ${Object.entries(c.mat).map(([m,q])=>`<div class="kv"><span>${esc(M[m].nom)}</span><span>${fq(q,M[m].unite)}</span></div>`).join("")||'<span class="hint">Aucun matériau.</span>'}</section>`).join("")}</div></div>
  <div class="sec"><div class="sec-h"><span>Véhicules</span></div><div class="rows">${Object.entries(d.veh).map(([v,o])=>`<div class="row"><span class="meta"><b>${esc(V[v].nom)}</b><span>${[...o.drv].map(x=>P[x].nom).join(", ")}</span></span><span class="dur">${o.days.size} j</span></div>`).join("")||'<div class="row"><span class="hint">Aucun véhicule.</span></div>'}</div></div>
  <div class="sec"><div class="sec-h"><span>Commentaires</span></div>${d.coms.length?`<div class="rows">${d.coms.map(([dt,w2,t])=>`<div class="row"><span class="meta"><b>${esc(fds(dt))} · ${esc(w2)}</b><span class="comment">${esc(t)}</span></span></div>`).join("")}</div>`:'<p class="hint">Aucun commentaire.</p>'}</div>
  <div class="sec"><div class="sec-h"><span>Destinataires</span></div>${recips}</div></div>`}

/* ---------- Rendu ---------- */
function canNext(){const sg=seg();switch(S.step){
  case"debut":return !!(S.date&&S.start);
  case"chantier":return !!sg.chantier;
  case"equipe":return sg.team.size>0;
  case"heures":return check(sg).errs.length===0;
  case"materiaux":return matIssues(sg)===0;
  case"conducteurs":return vehMissing().length===0&&drvConflicts().length===0;
  default:return true}}
function info(){const sg=seg();switch(S.step){
  case"equipe":return `${sg.team.size} personne(s)`;
  case"heures":{const n=check(sg).bad.size;return n?`${n} personne(s) à corriger`:"Horaires cohérents"}
  case"materiaux":{const n=matIssues(sg),bad=sg.mat.find(matBad);return n?(bad&&bad.qty>0?"Nombre entier attendu pour les unités et les kits":`${n} quantité(s) à saisir`):`${sg.mat.length} matériau(x)`}
  case"vehicules":return `${S.veh.size} véhicule(s)`;
  case"conducteurs":{const m=vehMissing().length;return m?`${m} véhicule(s) sans conducteur`:"Tous les véhicules ont un conducteur"}
  default:return ""}}
function bandFor(){if(UI.tab==="rapports")return["rapports","Mes rapports"];if(UI.tab==="semaine")return["semaine","Rapport hebdomadaire"];
  const st=S.step,n=S.cur+1;
  return({debut:["debut","Début de journée"],chantier:["chantier",`Chantier ${n}`],equipe:["chantier",`Chantier ${n} · équipe`],heures:["heures",`Chantier ${n} · horaires`],
    materiaux:["mat",`Chantier ${n} · matériaux`],suite:["chantier",`Chantier ${n} · terminé`],vehicules:["veh","Véhicules"],conducteurs:["veh","Conducteurs"],
    commentaire:["fin","Fin de journée"],recap:["fin","Fin de journée"],done:["fin","Journée enregistrée"]})[st]}
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===UI.tab));
  const[icn,txt]=bandFor();$("band").innerHTML=`${ico(icn)}<span>${esc(txt)}</span>`;
  document.documentElement.dataset.sec=UI.tab==="saisie"?SEC[S.step]:"fin";
  $("steps").hidden=UI.tab!=="saisie";
  if(UI.tab==="saisie"){const g=GROUP[S.step];document.querySelectorAll("#steps li").forEach((li,i)=>li.className=i<g?"done":i===g?"on":"");$("view").innerHTML=VIEWS[S.step]()}
  else $("view").innerHTML=UI.tab==="rapports"?rapportsView():semaineView();
  bar();
}
function bar(){const nx=$("next"),bk=$("back");
  if(UI.tab==="rapports"){bk.hidden=!UI.rep;bk.textContent="Retour à la liste";nx.hidden=!UI.rep;nx.disabled=false;nx.textContent="Repartir de ce rapport";$("info").textContent="";return}
  if(UI.tab==="semaine"){const sent=SENT[UI.wk];bk.hidden=UI.wstep!=="preview";bk.textContent="Modifier";nx.hidden=!UI.wk;
    nx.disabled=!!sent&&UI.wstep!=="preview";nx.textContent=UI.wstep==="preview"?"Confirmer l'envoi":sent?"Rapport envoyé":"Envoyer le rapport";
    $("info").textContent=UI.wstep==="preview"?"":sent?"":"Vous et les responsables des chantiers";return}
  bk.textContent="Retour";
  bk.hidden=S.step==="debut"||S.step==="done"||S.ret!=null;
  nx.hidden=S.step==="suite";
  nx.textContent=S.step==="done"?"Nouvelle journée":S.step==="recap"?"Enregistrer la journée":S.step==="heures"?(S.ret!=null?`Revenir au chantier ${S.ret+1}`:"Valider les horaires"):S.step==="materiaux"?(seg().mat.length?"Terminer les matériaux":"Aucun matériau"):S.step==="vehicules"&&S.veh.size===0?"Aucun véhicule":"Suivant";
  nx.disabled=!canNext();
  $("info").textContent=info();
}
function go(step){S.hist.push(S.step);S.step=step;S.q={};render();window.scrollTo(0,0)}
function focusTime(key){const el=document.querySelector(`select[data-tk="${key}"]`);if(!el)return;
  el.scrollIntoView({block:"center",behavior:"smooth"});el.focus({preventScroll:true});try{el.showPicker()}catch(_){}}
function focusMatSearch(i){const el=$("qm"+i);if(el){el.focus();el.scrollIntoView({block:"center",behavior:"smooth"})}}
function saveDay(){const r=toRep();HIST=HIST.filter(x=>x.date!==r.date);HIST.push(r);HIST.sort((a,b)=>b.date.localeCompare(a.date));
  const saved=store.get("ot-saved",[]).filter(x=>x.date!==r.date);saved.push(r);store.set("ot-saved",saved);
  const k=weekOf(r.date).key;if(SENT[k]){delete SENT[k];store.set("ot-sent",SENT)}}

$("next").onclick=()=>{
  if(UI.tab==="rapports"){const r=HIST.find(x=>x.id===UI.rep);reset(r);S.mode="veille";UI.tab="saisie";UI.rep=null;render();window.scrollTo(0,0);return}
  if(UI.tab==="semaine"){if(UI.wstep==="preview"){SENT[UI.wk]=nowLabel();store.set("ot-sent",SENT);UI.wstep="view"}else UI.wstep="preview";render();window.scrollTo(0,0);return}
  switch(S.step){
  case"debut":applyMode();if(S.mode!=="veille")S.segs[0].s.common=S.start;return go("chantier");
  case"chantier":return go("equipe");
  case"equipe":return go("heures");
  case"heures":if(S.ret!=null){S.cur=S.ret;S.ret=null;S.hist.pop();S.step="heures";render();window.scrollTo(0,0);return}return go("materiaux");
  case"materiaux":return go("suite");
  case"vehicules":return go(S.veh.size?"conducteurs":"commentaire");
  case"conducteurs":return go("commentaire");
  case"commentaire":return go("recap");
  case"recap":saveDay();return go("done");
  case"done":reset();return render();
}};
$("back").onclick=()=>{
  if(UI.tab==="rapports"){UI.rep=null;render();return}
  if(UI.tab==="semaine"){UI.wstep="view";render();return}
  const prev=S.hist.pop()||"debut";if(S.step==="chantier"&&prev==="suite")S.cur--;S.step=prev;render();window.scrollTo(0,0)};
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(!t)return;UI.tab=t.dataset.tab;UI.rep=null;UI.wstep="view";render();window.scrollTo(0,0)});

$("view").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.gotab){UI.tab=d.gotab;UI.wk=weekOf(S.date).key;render();window.scrollTo(0,0);return}
  if(d.rep){UI.rep=d.rep;render();window.scrollTo(0,0);return}
  if(d.wk){UI.wk=d.wk;UI.wstep="view";render();return}
  if(UI.tab!=="saisie")return;
  const sg=seg();
  if(d.mode){S.mode=d.mode;if(d.mode==="veille")S.start=S.base?.start||S.start}
  if(d.k)sg.chantier=d.k;
  if(d.p){sg.team.has(d.p)?sg.team.delete(d.p):sg.team.add(d.p)}
  if(d.allveille)baseTeam().forEach(id=>sg.team.add(id));
  if(d.same){const[k,on]=d.same.split("|"),g=sg[k];g.same=on==="1";if(!g.same)sg.team.forEach(id=>{if(g.v[id]==null)g.v[id]=g.common})}
  if(d.fix){const[k,id]=d.fix.split("|"),g=sg[k];let key=k==="s"?"cs":"ce";
    if(id!==leadOf(sg)){if(g.same){g.same=false;sg.team.forEach(x=>{if(g.v[x]==null)g.v[x]=g.common})}key=`${k}:${id}`}
    render();return focusTime(key)}
  if(d.goseg!=null&&d.goseg!==""&&d.goseg!==undefined){S.ret=S.cur;S.cur=+d.goseg;return go("heures")}
  if(d.v){S.veh.has(d.v)?(S.veh.delete(d.v),delete S.drv[d.v],delete S.vcom[d.v]):S.veh.add(d.v)}
  if(d.copy){const x=S.drv[d.copy];x.journee=x.matin;x.soir=x.matin}
  if(d.vopen){S.vopen.add(d.vopen);render();const t=$("vc-"+d.vopen);if(t)t.focus();return}
  if(d.addmat){const[i,id]=d.addmat.split("|");S.segs[+i].mat.push({id,qty:null});S.q["m"+i]="";render();
    const inp=document.querySelector(`input[data-qty="${i}|${id}"]`);if(inp)inp.focus();return}
  if(d.rmmat){const[i,id]=d.rmmat.split("|");S.segs[+i].mat=S.segs[+i].mat.filter(x=>x.id!==id)}
  if(d.focusmat!=null&&d.focusmat!==undefined&&d.focusmat!==""){return focusMatSearch(d.focusmat)}
  if(d.act==="more"){if(!S.segs[S.cur+1]){const endMax=Math.max(...[...sg.team].map(id=>pspan(sg,id)?.[1]??0)),endTxt=hm(endMax);
      const team=[...sg.team].filter(id=>pspan(sg,id)?.[1]===endMax);S.segs.push(newSeg(endTxt,team))}S.cur++;return go("chantier")}
  if(d.act==="stop"){S.segs.length=S.cur+1;return go("vehicules")}
  render();
});
function setQty(t){const[i,id]=t.dataset.qty.split("|"),x=S.segs[+i].mat.find(m=>m.id===id),n=parseFloat(String(t.value).replace(",","."));
  x.qty=isNaN(n)?null:n;t.classList.toggle("bad",matBad(x));const u=document.querySelector(`[data-unit="${i}|${id}"]`);if(u)u.textContent=UNITS[M[id].unite][x.qty>1?1:0];bar()}
$("view").addEventListener("change",e=>{const t=e.target;if(UI.tab!=="saisie")return;const sg=seg();
  if(t.dataset.tk){const[hs,ms]=t.parentElement.querySelectorAll("select"),v=hs.value?`${hs.value}:${ms.value}`:"",key=t.dataset.tk;
    if(key==="day")S.start=v;else if(key==="cs")sg.s.common=v;else if(key==="ce")sg.e.common=v;
    else{const[k,id]=key.split(":");sg[k].v[id]=v}}
  else if(t.id==="date")S.date=t.value;
  else if(t.dataset.drv){const[v,k]=t.dataset.drv.split("|");(S.drv[v]=S.drv[v]||{})[k]=t.value}
  else if(t.dataset.qty){setQty(t);return}
  else return;
  render();
});
$("view").addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.dataset.qty){e.preventDefault();setQty(t);focusMatSearch(t.dataset.qty.split("|")[0])}});
$("view").addEventListener("input",e=>{const t=e.target;
  if(t.id==="comment"){S.comment=t.value;return}
  if(t.dataset.vcom){S.vcom[t.dataset.vcom]=t.value;return}
  if(t.dataset.qty){setQty(t);return}
  if(t.id==="rq"){UI.rq=t.value;render();const n=$("rq");n.focus();n.setSelectionRange(n.value.length,n.value.length);return}
  if(t.dataset.q==null)return;
  S.q[t.dataset.q]=t.value;const id=t.id;render();const n=$(id);n.focus();n.setSelectionRange(n.value.length,n.value.length)});
$("who").textContent=`${P[ME].nom} · ${P[ME].role} · agence de ${AGENCE}`;
render();
</script>

</body></html>
